buildscript {
  repositories {
    mavenLocal()
    // https://maven.aliyun.com/mvn/view
    maven { url 'https://maven.aliyun.com/repository/public' }
    jcenter()
    mavenCentral()
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    maven { url 'https://plugins.gradle.org/m2/' }
  }
}

import java.nio.file.Files
import java.nio.file.Paths;

plugins {
  id 'java'
  id 'application'
  id 'idea'
  id 'checkstyle'
  id 'com.diffplug.spotless' version '8.3.0'
  id 'org.springframework.boot' version '3.5.11'
  id "io.freefair.lombok" version "9.2.0"
  id "io.spring.dependency-management" version "1.1.7"
}

allprojects {
  repositories {
    mavenLocal()
    maven { url 'https://maven.aliyun.com/repository/public' }
    jcenter()
    mavenCentral()
    maven { url 'https://repo.spring.io/release' }
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
  }
}

subprojects {
  apply plugin: 'java'
  apply plugin: 'application'
  apply plugin: 'idea'
  apply plugin: 'io.freefair.lombok'

  dependencies {
    // spring boot
    implementation 'org.springframework.boot:spring-boot-starter-web:3.5.11'
    implementation 'org.springframework.boot:spring-boot-starter-freemarker:3.5.11'
    implementation 'org.springframework.boot:spring-boot-devtools:3.5.11'
    implementation 'org.springframework.data:spring-data-commons:3.5.9'
    implementation 'org.springframework.boot:spring-boot-starter-aop:3.5.11'
    implementation 'org.springframework.boot:spring-boot-starter-logging:3.5.11'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.5.11'
    implementation 'org.springframework.plugin:spring-plugin-core:3.0.0'

    // database
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.16'
    implementation 'mysql:mysql-connector-java:8.0.16'

    // utils
    implementation 'com.sun.activation:jakarta.activation:2.0.1'
    implementation 'org.projectlombok:lombok:1.18.8'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
    implementation 'net.logstash.logback:logstash-logback-encoder:6.0'
    implementation 'cn.hutool:hutool-core:4.5.10'
    implementation 'cn.hutool:hutool-json:4.5.10'
    implementation 'cn.hutool:hutool-http:4.5.10'
  }

  /**
   * Watch java files' changes, and recompile
   *
   * ```
   * ./gradlew pro-*:watchJava -t
   * ./gradlew pro-*:watchJava --continuous
   * ```
   */
  // noinspection GroovyAssignabilityCheck
  task watchJava(type: GradleBuild) {
    description "Watch java files' changes, and recompile."
    inputs.files 'src/main/java'
    tasks = ['compileJava']
  }
}

spotless {
  java {
    if (System.properties.spotlessInclude != null) {
      def s = ((String)System.properties.spotlessInclude).split(',')
      def i = Arrays.asList(s)
      target  i
    }
    else {
      target 'pro-common/**/java/**/*.java', 'pro-admin/**/java/**/*.java', 'pro-front/**/java/**/*.java'
    }
    googleJavaFormat()
  }
}

checkstyle {
  toolVersion '8.21'
}

/**
 * checkstyle all java files
 *
 * @note - Task[Checkstyle] depends on Plugin[checkstyle]
 *       - Checkstyle does not have functionality of auto-fixing
 */
// noinspection GroovyAssignabilityCheck
task checkJava(type: Checkstyle) {
  configFile = file('config/checkstyle/checkstyle.xml')
  classpath = files()
  source 'pro-common/**/java/**/*.java', 'pro-admin/**/java/**/*.java', 'pro-front/**/java/**/*.java'
}

try {
  // Copy git pre-commit hook
  if (Files.exists(Paths.get('.git')) && !Files.exists(Paths.get('.git/hooks/pre-commit'))) {
    Files.copy(Paths.get('config/hooks/pre-commit-stub'), Paths.get('.git/hooks/pre-commit'));
  }
}
catch (e) {}
